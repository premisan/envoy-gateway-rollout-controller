apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: envoygatewayrollouts.rollout.envoyproxy.io
spec:
  group: rollout.envoyproxy.io
  names:
    kind: EnvoyGatewayRollout
    listKind: EnvoyGatewayRolloutList
    plural: envoygatewayrollouts
    singular: envoygatewayrollout
    shortNames:
      - egr
      - egrollout
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Target-Version
          type: string
          jsonPath: .spec.version
        - name: Current-Step
          type: integer
          jsonPath: .status.currentStep
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - version
                - gateway
                - envoyProxy
                - strategy
              properties:
                version:
                  type: string
                  description: "Desired Envoy Gateway version (e.g. v1.6.1, v1.7.0)"
                targetNamespace:
                  type: string
                  default: "envoy-gateway-system"
                  description: "Target namespace (default: envoy-gateway-system)"
                gateway:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                    gatewayClassName:
                      type: string
                      description: "GatewayClass name (default: eg)"
                    listeners:
                      type: array
                      items:
                        type: object
                        required:
                          - name
                          - protocol
                          - port
                        properties:
                          name:
                            type: string
                          protocol:
                            type: string
                            enum: [HTTP, HTTPS, TCP, UDP, TLS]
                          port:
                            type: integer
                          tlsSecretName:
                            type: string
                envoyProxy:
                  type: object
                  properties:
                    name:
                      type: string
                      description: "EnvoyProxy resource name (default: proxy-config)"
                    nodeSelector:
                      type: object
                      additionalProperties:
                        type: string
                    tolerations:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                          operator:
                            type: string
                          value:
                            type: string
                          effect:
                            type: string
                    annotations:
                      type: object
                      additionalProperties:
                        type: string
                strategy:
                  type: object
                  required:
                    - steps
                  properties:
                    steps:
                      type: array
                      items:
                        type: object
                        required:
                          - nodes
                        properties:
                          nodes:
                            type: string
                          pause:
                            type: object
                            properties:
                              duration:
                                type: string
                          pauseDuration:
                            type: string
                analysis:
                  type: object
                  properties:
                    ephemeralPrometheus:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true
                        retention:
                          type: string
                          default: "2h"
                        scrapeInterval:
                          type: string
                          default: "5s"
                        image:
                          type: string
                    prometheusUrl:
                      type: string
                    interval:
                      type: string
                      default: "15s"
                    failureLimit:
                      type: integer
                      default: 3
                    metrics:
                      type: array
                      items:
                        type: object
                        required:
                          - name
                          - threshold
                          - query
                        properties:
                          name:
                            type: string
                          threshold:
                            type: number
                          query:
                            type: string
                control:
                  type: object
                  properties:
                    paused:
                      type: boolean
                    abort:
                      type: boolean
                    forcePromote:
                      type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                currentVersion:
                  type: string
                targetVersion:
                  type: string
                currentStep:
                  type: integer
                totalSteps:
                  type: integer
                stepTimeRemaining:
                  type: string
                ephemeralPrometheusUrl:
                  type: string
                consecutiveFailures:
                  type: integer
                message:
                  type: string
                nodes:
                  type: array
                  items:
                    type: object
                    properties:
                      nodeName:
                        type: string
                      nodeIP:
                        type: string
                      phase:
                        type: string
                      activeVersion:
                        type: string
                      canaryVersion:
                        type: string
                      drainProgress:
                        type: integer
                      activeSessions:
                        type: integer
                      errorCount5xx:
                        type: integer
                lastMetricSnapshot:
                  type: object
                  additionalProperties:
                    type: number
                lastUpdateTime:
                  type: string
                  format: date-time
