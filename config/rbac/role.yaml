apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: envoy-gateway-rollout-controller-role
rules:
  # Rollout Controller CRDs
  - apiGroups: ["rollout.envoyproxy.io"]
    resources: ["*"]
    verbs: ["*"]

  # Gateway API & EnvoyProxy
  - apiGroups: ["gateway.networking.k8s.io", "gateway.envoyproxy.io"]
    resources: ["*"]
    verbs: ["*"]

  # Core Resources
  - apiGroups: [""]
    resources: ["namespaces", "services", "configmaps", "secrets", "serviceaccounts", "pods", "nodes", "events", "endpoints"]
    verbs: ["*"]

  # Apps & Batch
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["*"]

  # CRD management (for Envoy Gateway CRD pre-upgrades)
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["*"]

  # RBAC management (for Envoy Gateway Helm stack)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["*"]

  # Admission registration (Webhooks & Admission Policies)
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations", "validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["*"]

  # Autoscaling & Policy
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["*"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["*"]

  # Discovery (EndpointSlice management for zero-downtime overlapping canary pods)
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["*"]

  # Coordination
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["*"]
