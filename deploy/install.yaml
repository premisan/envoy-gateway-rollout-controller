---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: envoygatewayrollouts.rollout.envoyproxy.io
spec:
  group: rollout.envoyproxy.io
  names:
    kind: EnvoyGatewayRollout
    listKind: EnvoyGatewayRolloutList
    plural: envoygatewayrollouts
    singular: envoygatewayrollout
    shortNames:
      - egr
      - egrollout
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Target-Version
          type: string
          jsonPath: .spec.version
        - name: Current-Step
          type: integer
          jsonPath: .status.currentStep
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - version
                - gateway
                - envoyProxy
                - strategy
              properties:
                version:
                  type: string
                  description: "Desired Envoy Gateway version (e.g. v1.6.1, v1.7.0)"
                targetNamespace:
                  type: string
                  default: "envoy-gateway-system"
                  description: "Target namespace (default: envoy-gateway-system)"
                gateway:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                    gatewayClassName:
                      type: string
                      description: "GatewayClass name (default: eg)"
                    listeners:
                      type: array
                      items:
                        type: object
                        required:
                          - name
                          - protocol
                          - port
                        properties:
                          name:
                            type: string
                          protocol:
                            type: string
                            enum: [HTTP, HTTPS, TCP, UDP, TLS]
                          port:
                            type: integer
                          tlsSecretName:
                            type: string
                envoyProxy:
                  type: object
                  properties:
                    name:
                      type: string
                      description: "EnvoyProxy resource name (default: proxy-config)"
                    nodeSelector:
                      type: object
                      additionalProperties:
                        type: string
                    tolerations:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                          operator:
                            type: string
                          value:
                            type: string
                          effect:
                            type: string
                    annotations:
                      type: object
                      additionalProperties:
                        type: string
                strategy:
                  type: object
                  required:
                    - steps
                  properties:
                    steps:
                      type: array
                      items:
                        type: object
                        required:
                          - nodes
                        properties:
                          nodes:
                            type: string
                          pause:
                            type: object
                            properties:
                              duration:
                                type: string
                          pauseDuration:
                            type: string
                analysis:
                  type: object
                  properties:
                    ephemeralPrometheus:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true
                        retention:
                          type: string
                          default: "2h"
                        scrapeInterval:
                          type: string
                          default: "5s"
                        image:
                          type: string
                    prometheusUrl:
                      type: string
                    interval:
                      type: string
                      default: "15s"
                    failureLimit:
                      type: integer
                      default: 3
                    metrics:
                      type: array
                      items:
                        type: object
                        required:
                          - name
                          - threshold
                          - query
                        properties:
                          name:
                            type: string
                          threshold:
                            type: number
                          query:
                            type: string
                control:
                  type: object
                  properties:
                    paused:
                      type: boolean
                    abort:
                      type: boolean
                    forcePromote:
                      type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                currentVersion:
                  type: string
                targetVersion:
                  type: string
                currentStep:
                  type: integer
                totalSteps:
                  type: integer
                stepTimeRemaining:
                  type: string
                ephemeralPrometheusUrl:
                  type: string
                consecutiveFailures:
                  type: integer
                message:
                  type: string
                nodes:
                  type: array
                  items:
                    type: object
                    properties:
                      nodeName:
                        type: string
                      nodeIP:
                        type: string
                      phase:
                        type: string
                      activeVersion:
                        type: string
                      canaryVersion:
                        type: string
                      drainProgress:
                        type: integer
                      activeSessions:
                        type: integer
                      errorCount5xx:
                        type: integer
                lastMetricSnapshot:
                  type: object
                  additionalProperties:
                    type: number
                lastUpdateTime:
                  type: string
                  format: date-time
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: envoy-gateway-rollout-controller
  namespace: envoy-gateway-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: envoy-gateway-rollout-controller-role
rules:
  # Rollout Controller CRDs
  - apiGroups: ["rollout.envoyproxy.io"]
    resources: ["*"]
    verbs: ["*"]

  # Gateway API & EnvoyProxy
  - apiGroups: ["gateway.networking.k8s.io", "gateway.envoyproxy.io"]
    resources: ["*"]
    verbs: ["*"]

  # Core Resources
  - apiGroups: [""]
    resources: ["namespaces", "services", "configmaps", "secrets", "serviceaccounts", "pods", "nodes", "events", "endpoints"]
    verbs: ["*"]

  # Apps & Batch
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["*"]

  # CRD management (for Envoy Gateway CRD pre-upgrades)
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["*"]

  # RBAC management (for Envoy Gateway Helm stack)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["*"]

  # Admission registration (Webhooks & Admission Policies)
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations", "validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["*"]

  # Autoscaling & Policy
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["*"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["*"]

  # Discovery (EndpointSlice management for zero-downtime overlapping canary pods)
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["*"]

  # Coordination
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: envoy-gateway-rollout-controller-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: envoy-gateway-rollout-controller-role
subjects:
  - kind: ServiceAccount
    name: envoy-gateway-rollout-controller
    namespace: envoy-gateway-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-gateway-rollout-controller
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: envoy-gateway-rollout-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy-gateway-rollout-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: envoy-gateway-rollout-controller
    spec:
      serviceAccountName: envoy-gateway-rollout-controller
      containers:
        - name: manager
          image: premisan0/envoy-gateway-rollout-controller:v1.0.17
          imagePullPolicy: Always
          env:
            - name: HOME
              value: /tmp
          command:
            - /manager
          args:
            - --web-bind-address=:8080
            - --metrics-bind-address=:8081
            - --health-probe-bind-address=:8082
          ports:
            - name: http-ui
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-gateway-rollout-controller
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: envoy-gateway-rollout-controller
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: envoy-gateway-rollout-controller
  ports:
    - name: http
      port: 80
      targetPort: 8080
